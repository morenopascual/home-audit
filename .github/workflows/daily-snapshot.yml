name: Daily home audit snapshot

on:
  schedule:
    # Runs every hour at :07. random_hour_gate.py decides which one of
    # these 24 runs is actually "today's photo" -- see that file for why.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run now regardless of the hour (and overwrite today's snapshot if one exists)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: home-audit-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if this is today's random hour
        id: gate
        if: ${{ github.event.inputs.force != 'true' }}
        run: python random_hour_gate.py
        continue-on-error: true

      - name: Install dependencies
        if: ${{ github.event.inputs.force == 'true' || steps.gate.outcome == 'success' }}
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Take today's photo
        if: ${{ github.event.inputs.force == 'true' || steps.gate.outcome == 'success' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scrape.py --force
          else
            python scrape.py
          fi

      - name: Commit and push if changed
        if: ${{ github.event.inputs.force == 'true' || steps.gate.outcome == 'success' }}
        run: |
          git config user.name "home-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json home-audit-comparativa.html debug/ 2>/dev/null || git add history.json home-audit-comparativa.html
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git pull --rebase
          git push
